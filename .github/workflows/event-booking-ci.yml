name: Event Booking CI

# This repository holds several exercises, so the workflow only runs when the Event Booking project changes.
on:
  push:
    branches: [main]
    paths:
      - 'Event_booking_platform/**'
      - '.github/workflows/event-booking-ci.yml'
  pull_request:
    paths:
      - 'Event_booking_platform/**'
      - '.github/workflows/event-booking-ci.yml'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Event_booking_platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Event_booking_platform/backend/pom.xml
      # Integration tests start a MySQL container through Testcontainers (Docker is preinstalled on the runner).
      - run: mvn -B clean test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Event_booking_platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Event_booking_platform/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
