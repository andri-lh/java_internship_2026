spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/event_booking_db?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:event_booking_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.al.lhind.eventbooking=DEBUG

# Local mail catcher (Mailpit, see compose.yaml). Inbox UI: http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
