spring.application.name=event-booking-platform
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

server.port=${SERVER_PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

logging.level.root=INFO
logging.level.al.lhind.eventbooking=INFO

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.mail.from=${MAIL_FROM:no-reply@eventbooking.local}

# Comma-separated browser origins allowed to call the API (only needed when the frontend is on another host)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Health endpoint for load balancers and platform readiness checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
